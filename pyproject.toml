[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-revisao-ifg"
version = "1.0.0"
description = "Contrato de dados e validador para as aulas do Hermes (revisao-ifg)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["education", "study", "json-schema", "ifg", "hermes", "redacao-oficial"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education"
]

[project.scripts]
hermes-validate = "validate:main"
hermes-build = "build:main"

[tool.setuptools]
py-modules = ["validate", "build"]
